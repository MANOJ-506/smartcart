{% extends "admin/admin_base.html" %}

{% block title %}Add Product - SmartCart Admin{% endblock %}
{% block admin_page_title %}Add Product{% endblock %}

{% block admin_content %}
<div class="container-narrow">
    <div class="card">
        <div class="card-header">
            <h2>Add New Product</h2>
            <a href="{{ url_for('item_list') }}" style="font-size: 0.85rem;">View All Products</a>
        </div>

        <form method="POST" action="/admin/add-item" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label" for="prod_name">Product Name</label>
                <input
                    type="text"
                    id="prod_name"
                    name="name"
                    class="form-control"
                    placeholder="Enter product title"
                    required
                    autofocus
                >
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label" for="prod_category">Category</label>
                    <input
                        type="text"
                        id="prod_category"
                        name="category"
                        class="form-control"
                        placeholder="e.g. Electronics, Footwear"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="prod_price">Price (₹)</label>
                    <input
                        type="number"
                        step="0.01"
                        id="prod_price"
                        name="price"
                        class="form-control"
                        placeholder="0.00"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="prod_desc">Description</label>
                <textarea
                    id="prod_desc"
                    name="description"
                    class="form-control"
                    placeholder="Enter product specifications and details..."
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="prod_image">Product Image</label>
                <input
                    type="file"
                    id="prod_image"
                    name="image"
                    class="form-control"
                    accept="image/*"
                    data-preview-target="add_preview"
                    required
                >
            </div>

            <div style="margin-bottom: 1.25rem;">
                <img id="add_preview" src="#" alt="Preview" style="display: none; max-width: 140px; max-height: 120px; object-fit: contain; border: 1px solid var(--border); border-radius: var(--radius); padding: 2px;">
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary">
                    Publish Product
                </button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
