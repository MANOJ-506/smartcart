{% extends "user/user_base.html" %}

{% block title %}Add Address - SmartCart{% endblock %}

{% block user_content %}
<div class="container-narrow">
    <div class="card">
        <div class="card-header">
            <h2>Add New Address</h2>
        </div>

        <form method="POST" action="/user/address/add">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label" for="add_full_name">Full Name</label>
                    <input type="text" id="add_full_name" name="full_name" class="form-control" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="add_phone">Phone Number</label>
                    <input type="tel" id="add_phone" name="phone" class="form-control" maxlength="15" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="add_line1">Address Line 1</label>
                <input type="text" id="add_line1" name="address_line1" class="form-control" placeholder="House / Flat / Building" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="add_line2">Address Line 2 (Optional)</label>
                <input type="text" id="add_line2" name="address_line2" class="form-control" placeholder="Street / Landmark">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label" for="add_city">City</label>
                    <input type="text" id="add_city" name="city" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="add_state">State</label>
                    <input type="text" id="add_state" name="state" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="add_pincode">Pincode</label>
                    <input type="text" id="add_pincode" name="pincode" class="form-control" maxlength="10" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="add_type">Address Type</label>
                <select id="add_type" name="address_type" class="form-control">
                    <option value="Home">Home</option>
                    <option value="Work">Work</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary">Save Address</button>
                <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
