
<!DOCTYPE html>
<html>

<head>
    <title>Create Password</title>
</head>

<body>

<h2>Create Your Password</h2>

<p>
    Email:
    <strong>{{ email }}</strong>
</p>


<!-- =====================================================
     FLASH MESSAGES
====================================================== -->

{% with messages = get_flashed_messages(with_categories=true) %}

    {% for category, message in messages %}

        <p style="color:red;">
            {{ message }}
        </p>

    {% endfor %}

{% endwith %}


<!-- =====================================================
     PASSWORD FORM
====================================================== -->

<form method="POST" action="/user-create-password">

    <label>
        Password:
    </label>

    <br>

    <input
        type="password"
        name="password"
        minlength="6"
        required
    >

    <br><br>


    <label>
        Confirm Password:
    </label>

    <br>

    <input
        type="password"
        name="confirm_password"
        minlength="6"
        required
    >

    <br><br>


    <button type="submit">
        Create Account
    </button>

</form>

</body>

</html>
