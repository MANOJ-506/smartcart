<!DOCTYPE html>
<html>

<head>

    <title>Delivery Address</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        .product {
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .product h3 {
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 80px;
        }

        .pay-btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .pay-btn:hover {
            background-color: #218838;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Delivery Address</h2>

    <!-- Product Information -->

    <div class="product">

        <h3>{{ product.name }}</h3>

        <p>Category: {{ product.category }}</p>

        <p>
            Price:
            <strong>₹{{ product.price }}</strong>
        </p>

    </div>


    <!-- Address Form -->

    <form method="POST"
          action="/user/proceed-to-pay/{{ product.product_id }}">

        <div class="form-group">

            <label>Full Name</label>

            <input type="text"
                   name="full_name"
                   placeholder="Enter your full name"
                   required>

        </div>


        <div class="form-group">

            <label>Mobile Number</label>

            <input type="text"
                   name="mobile"
                   placeholder="Enter mobile number"
                   required>

        </div>


        <div class="form-group">

            <label>House / Flat / Building</label>

            <input type="text"
                   name="house"
                   placeholder="House / Flat / Building"
                   required>

        </div>


        <div class="form-group">

            <label>Street / Area</label>

            <input type="text"
                   name="street"
                   placeholder="Street / Area"
                   required>

        </div>


        <div class="form-group">

            <label>City</label>

            <input type="text"
                   name="city"
                   placeholder="City"
                   required>

        </div>


        <div class="form-group">

            <label>State</label>

            <input type="text"
                   name="state"
                   placeholder="State"
                   required>

        </div>


        <div class="form-group">

            <label>Pincode</label>

            <input type="text"
                   name="pincode"
                   placeholder="Pincode"
                   required>

        </div>


        <button type="submit" class="pay-btn">
            Proceed to Pay ₹{{ product.price }}
        </button>

    </form>


    <a href="/user/products" class="back-btn">
        ← Back to Products
    </a>

</div>

</body>

</html>
