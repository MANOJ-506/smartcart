<!DOCTYPE html>
<html>

<head>

    <title>My Orders</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 800px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .btn {
            display: inline-block;
            padding: 7px 10px;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border-radius: 5px;
        }

        .empty {
            text-align: center;
            padding: 30px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>My Orders</h2>


    {% if orders %}

    <table>

        <tr>

            <th>Order ID</th>

            <th>Amount</th>

            <th>Payment Status</th>

            <th>Date</th>

            <th>Invoice</th>

        </tr>


        {% for order in orders %}

        <tr>

            <td>
                #{{ order.order_id }}
            </td>

            <td>
                ₹{{ order.amount }}
            </td>

            <td>
                {{ order.payment_status }}
            </td>

            <td>
                {{ order.created_at }}
            </td>

            <td>

                <a
                    href="/user/download-invoice/{{ order.order_id }}"
                    class="btn">
                    Download
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

    {% else %}

    <div class="empty">

        <p>You haven't placed any orders yet.</p>

        <a href="/user/products">
            Start Shopping
        </a>

    </div>

    {% endif %}

</div>

</body>

</html>
