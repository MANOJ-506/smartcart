
<!DOCTYPE html>
<html>

<head>
    <title>Verify OTP</title>
</head>

<body>

<h2>Verify Your Email</h2>

<p>
    OTP has been sent to:
</p>

<strong>{{ email }}</strong>

<br><br>


<!-- =====================================================
     FLASH MESSAGES
====================================================== -->

{% with messages = get_flashed_messages(with_categories=true) %}

    {% for category, message in messages %}

        <p style="color:red;">
            {{ message }}
        </p>

    {% endfor %}

{% endwith %}


<!-- =====================================================
     OTP FORM
====================================================== -->

<form method="POST" action="/user-verify-otp">

    <label>
        Enter OTP:
    </label>

    <br>

    <input
        type="text"
        name="otp"
        maxlength="6"
        minlength="6"
        pattern="[0-9]{6}"
        required
    >

    <br><br>

    <button type="submit">
        Verify OTP
    </button>

</form>


<br>

<a href="/user-register">
    Back to Registration
</a>


</body>

</html>
