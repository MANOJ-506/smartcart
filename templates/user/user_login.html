
<!DOCTYPE html>
<html>

<head>
    <title>User Login</title>
</head>

<body>

<h2>User Login</h2>


<!-- =====================================================
     FLASH MESSAGES
====================================================== -->

{% with messages = get_flashed_messages(with_categories=true) %}

    {% for category, message in messages %}

        <p style="color:red;">
            {{ message }}
        </p>

    {% endfor %}

{% endwith %}


<!-- =====================================================
     LOGIN FORM
====================================================== -->

<form method="POST" action="/user-login">

    <label>
        Email:
    </label>

    <br>

    <input
        type="email"
        name="email"
        required
    >

    <br><br>


    <label>
        Password:
    </label>

    <br>

    <input
        type="password"
        name="password"
        required
    >

    <br><br>


    <button type="submit">
        Login
    </button>

</form>


<br>

<a href="/user-register">
    Don't have an account? Register
</a>


</body>

</html>
