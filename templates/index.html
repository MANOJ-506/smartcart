{% extends "base.html" %}

{% block title %}SmartCart - Welcome{% endblock %}

{% block layout %}
<div class="auth-wrapper" style="min-height: 85vh;">
    <div style="max-width: 520px; width: 100%; text-align: center;">
        <div style="margin-bottom: 2rem;">
            <a href="/" class="brand-logo" style="font-size: 2rem; margin-bottom: 1rem;">
                <i class="fa-solid fa-cart-shopping"></i> Smart<span>Cart</span>
            </a>
            <h1 style="font-size: 1.5rem; margin-top: 1rem; margin-bottom: 0.5rem;">
                Simple &amp; Reliable Online Shopping
            </h1>
            <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.5;">
                Browse our catalog of products and checkout securely in just a few steps.
            </p>
        </div>

        <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 2.5rem; flex-wrap: wrap;">
            <a href="{{ url_for('user_login') }}" class="btn btn-primary btn-lg" style="min-width: 140px;">
                Shop Now
            </a>
            <a href="{{ url_for('admin_login') }}" class="btn btn-secondary btn-lg" style="min-width: 140px;">
                Admin Portal
            </a>
        </div>

        <div style="border-top: 1px solid var(--border); padding-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
            New customer? <a href="{{ url_for('user_register') }}">Create an Account</a>
        </div>
    </div>
</div>
{% endblock %}
